<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f0e0c">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Finanças">
<link rel="apple-touch-icon" href="icon-180.png?v=1">
<link rel="manifest" href="manifest.json">
<title>Finanças a Dois</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230f0e0c'/%3E%3Ccircle cx='26' cy='32' r='13' fill='none' stroke='%23d4a84b' stroke-width='4'/%3E%3Ccircle cx='38' cy='32' r='13' fill='none' stroke='%23e8c97a' stroke-width='4'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
/* Layout: app de bolso em coluna única (máx. 720px), navegação fixa embaixo, folhas que sobem para lançar/editar */
:root{
  --bg:#0f0e0c; --s1:#1a1916; --s2:#222019; --line:#2e2c26;
  --gold:#d4a84b; --gold2:#e8c97a; --gold-soft:rgba(212,168,75,.12);
  --fg:#f0ece0; --fg2:#a09880; --fg3:#6b6453;
  --green:#5cb87a; --red:#e05c5c; --blue:#5c8de0; --purple:#9b7fe0;
  --serif:"DM Serif Display",Georgia,"Times New Roman",serif;
  --sans:"DM Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:18px; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:15px;line-height:1.45;-webkit-text-size-adjust:100%}
body{min-height:100vh;padding-bottom:calc(84px + env(safe-area-inset-bottom,0px));overflow-x:clip}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{font-size:16px}   /* abaixo de 16px o iPhone dá zoom ao tocar no campo */
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
[hidden]{display:none!important}
.num{font-variant-numeric:tabular-nums}
.serif{font-family:var(--serif);font-weight:400}
.muted{color:var(--fg2)} .dim{color:var(--fg3)}
.pos{color:var(--green)} .neg{color:var(--red)}
.label{font-size:.7rem;text-transform:uppercase;letter-spacing:.1em;color:var(--fg3);font-weight:600}
h1,h2,h3{margin:0;font-weight:400;text-wrap:balance}
h2{font-family:var(--serif);font-size:1.3rem}
h3{font-size:.95rem;font-weight:600}

.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* topo */
.top{position:sticky;top:0;z-index:20;background:rgba(15,14,12,.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-block:12px}
.brand{font-family:var(--serif);font-size:1.45rem;letter-spacing:.02em;color:var(--gold);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1 1 auto;min-width:0}
.month{display:flex;align-items:center;gap:4px;flex:none}
.month button{background:none;border:1px solid var(--line);border-radius:10px;width:32px;height:32px;color:var(--fg2);font-size:1.1rem;line-height:1;padding:0}
.month strong{font-weight:600;font-size:.88rem;min-width:4.8rem;text-align:center;text-transform:capitalize;white-space:nowrap}
.avatar{border-radius:50%;display:grid;place-items:center;font-weight:700;color:var(--bg);flex:none;border:0}
.avatar-btn{background:none;border:0;padding:0;border-radius:50%;flex:none;display:grid}
.eye{background:none;border:0;color:var(--fg3);width:32px;height:32px;display:grid;place-items:center;padding:0;flex:none}
.eye svg{width:20px;height:20px}
.eye[aria-pressed="true"]{color:var(--gold)}
.invite{background:var(--gold-soft);border:1px solid rgba(212,168,75,.4);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:2px;font-size:.9rem;color:var(--fg2)}
.invite b{color:var(--gold2);font-size:1rem}
.invite-box{display:flex;flex-direction:column;gap:10px}
.btn.wa{background:#25d366;color:#05210f;text-align:center;text-decoration:none;display:block}
.upd{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));z-index:40;background:var(--s2);border:1px solid var(--gold);border-radius:14px;padding:8px 8px 8px 14px;display:flex;gap:12px;align-items:center;font-size:.9rem;width:max-content;max-width:calc(100% - 32px)}
.check-row{display:flex;gap:10px;align-items:center;font-size:.92rem;color:var(--fg2)}
.check-row input{width:20px;height:20px;accent-color:var(--gold);flex:none}
.hero{display:flex;gap:16px;align-items:center}
.hero .who-name{font-family:var(--serif);font-size:1.5rem;line-height:1.1}
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.swatches label{position:relative}
.swatches input{position:absolute;opacity:0;inset:0;margin:0}
.swatches span{display:block;width:34px;height:34px;border-radius:50%;border:2px solid transparent;box-shadow:inset 0 0 0 3px var(--s1)}
.swatches input:checked+span{border-color:var(--fg)}
.swatches input:focus-visible+span{outline:2px solid var(--gold);outline-offset:2px}

main{padding-block:18px 24px;display:flex;flex-direction:column;gap:14px}
.card{background:var(--s1);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.empty{color:var(--fg3);text-align:center;padding:18px 6px;font-size:.92rem}

/* resumo */
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.kpi .v{font-family:var(--serif);font-size:1.6rem;line-height:1.15;overflow-wrap:anywhere;font-variant-numeric:tabular-nums}
.kpi.big .v{color:var(--gold2)}
.today{font-size:.85rem;color:var(--fg2);border-top:1px solid var(--line);padding-top:10px}
@media (max-width:440px){.kpi .v{font-size:1.2rem}}

/* listas */
.rows{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:4px minmax(0,1fr) auto;gap:12px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line);background:none;border-left:0;border-right:0;border-top:0;text-align:left;width:100%}
.row:last-child{border-bottom:0}
.row .tag{align-self:stretch;border-radius:2px;width:4px}
.row b{font-weight:600;display:block;overflow-wrap:anywhere}
.row small{color:var(--fg2);font-size:.8rem;display:block}
.row .amt{text-align:right;font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
button.row:hover{background:var(--s2)}
.day{margin-top:6px}
.day-h{display:flex;justify-content:space-between;font-size:.72rem;text-transform:uppercase;letter-spacing:.1em;color:var(--fg3);font-weight:600;padding:8px 0 2px}
.pill{display:inline-block;font-size:.68rem;font-weight:600;padding:1px 7px;border-radius:999px;margin-left:6px;vertical-align:1px;background:var(--gold-soft);color:var(--gold2)}
.pill.p{background:rgba(155,127,224,.15);color:var(--purple)}
.who{font-weight:600}

/* gráficos */
.donut-wrap{display:grid;grid-template-columns:150px minmax(0,1fr);gap:18px;align-items:center}
.donut{width:150px;height:150px;border-radius:50%;position:relative}
.donut::after{content:"";position:absolute;inset:22px;border-radius:50%;background:var(--s1)}
.donut>span{position:absolute;inset:0;display:grid;place-items:center;z-index:1;text-align:center;font-size:.8rem;color:var(--fg2)}
.donut span b{display:block;font-family:var(--serif);font-weight:400;font-size:1.1rem;color:var(--fg)}
.legend{display:flex;flex-direction:column;gap:6px;font-size:.86rem;min-width:0}
.legend div{display:grid;grid-template-columns:10px minmax(0,1fr) auto;gap:8px;align-items:center}
.legend i{width:10px;height:10px;border-radius:3px}
.legend em{font-style:normal;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (max-width:440px){.donut-wrap{grid-template-columns:1fr;justify-items:center}.legend{width:100%}}
.bars{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px;align-items:end;height:150px;padding-top:8px}
.bar{display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.bar .pair{display:flex;gap:3px;align-items:flex-end;flex:1;min-height:0;width:100%;justify-content:center}
.bar .pair i{display:block;width:min(14px,40%);border-radius:4px 4px 1px 1px;min-height:2px}
.bar small{font-size:.7rem;color:var(--fg3);text-transform:capitalize}
.bar.cur small{color:var(--gold2);font-weight:600}
.keys{display:flex;gap:14px;font-size:.78rem;color:var(--fg2)}
.keys i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px}
.meter{height:6px;background:var(--s2);border-radius:3px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--gold);border-radius:3px}
.split{display:grid;gap:8px}
.split div{display:grid;grid-template-columns:6.5rem minmax(0,1fr) auto;gap:10px;align-items:center;font-size:.88rem}
.split .num{text-align:right}

/* formulários */
.form{display:flex;flex-direction:column;gap:12px}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.g2 .full{grid-column:1/-1}
@media (max-width:420px){.g2{grid-template-columns:1fr}}
.f{display:flex;flex-direction:column;gap:5px;min-width:0}
.f>span{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--fg3);font-weight:600}
.f input,.f select,.f textarea{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:11px 12px;width:100%;min-width:0}
.f input.big{font-family:var(--serif);font-size:1.8rem;padding:8px 12px;color:var(--gold2)}
.f input[type=color]{padding:3px;height:44px}
/* iPhone: campo de data/mês tem largura mínima própria e estoura a coluna */
.f input[type=date],.f input[type=month]{-webkit-appearance:none;appearance:none;display:block;min-width:0;max-width:100%;min-height:46px;text-align:left}
.f input::-webkit-date-and-time-value{text-align:left;margin:0}
.f select{-webkit-appearance:none;appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--fg3) 50%),linear-gradient(135deg,var(--fg3) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:32px;text-overflow:ellipsis}
.f input.pin{font-size:1.4rem;letter-spacing:.5em;text-align:center;padding:10px 12px}
.f.check input,.f.check select{border-color:var(--gold);box-shadow:0 0 0 3px var(--gold-soft)}
.btn{border:1px solid transparent;border-radius:12px;padding:12px 16px;font-weight:600;background:var(--s2);color:var(--fg)}
.btn.gold{background:var(--gold);color:#1a1405}
.btn.gold:hover{background:var(--gold2)}
.btn.ghost{background:none;border-color:var(--line);color:var(--fg2)}
.btn.danger{color:var(--red)}
.btn.armed{background:var(--red);color:#fff;border-color:var(--red)}
.btn.sm{padding:6px 10px;font-size:.82rem;border-radius:9px}
.btn:disabled{opacity:.5;cursor:default}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.actions .btn.gold{flex:1}
.hint{font-size:.82rem;color:var(--fg2)}
.hint:empty{display:none}
.err{color:var(--red);font-size:.85rem}
.err:empty{display:none}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:3px}
.alert{border-radius:12px;padding:10px 12px;font-size:.9rem}
.alert.ok{background:rgba(92,184,122,.1);border:1px solid rgba(92,184,122,.35);color:#bfe6cc}
.alert.bad{background:rgba(224,92,92,.12);border:1px solid rgba(224,92,92,.45);color:#ffd2cf}
.row.ag .amt{display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.row.ag .amt small{font-weight:500;font-size:.74rem}
.row .amt small{display:block}
.fat{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-top:6px;font-size:.86rem;color:var(--fg2);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
/* Contas e Cartões: a lista vem antes do formulário de cadastro */
main.sub-cartoes>section:first-of-type,main.sub-contas>section:first-of-type{order:2}
.pay-chip{display:block;margin-top:4px;font-size:.7rem;font-weight:700;color:#1a1405;background:var(--gold);border-radius:999px;padding:2px 9px;text-align:center}
.row.ag2 .amt{display:flex;flex-direction:column;align-items:flex-end}
.row.ag2 .dt.neg{font-weight:700;font-size:.72rem}
.pill.due{background:rgba(212,168,75,.15);color:var(--gold2)}
.pill.late{background:rgba(224,92,92,.15);color:var(--red)}
.view-head{display:flex;flex-direction:column;gap:4px;margin-bottom:14px}
.view-v{font-family:var(--serif);font-size:2.4rem;line-height:1.1}
.view-d{font-size:1.1rem;font-weight:600}
.dets{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.det{display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);font-size:.92rem}
.det span:first-child{color:var(--fg3)}
.det b{font-weight:600;text-align:right;overflow-wrap:anywhere}
.dotc{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:7px;vertical-align:0}
.obs{margin-top:12px;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.obs p{margin:4px 0 0;color:var(--fg2);font-size:.92rem}
.sheet .actions .btn{flex:1}
.imp-cat{margin-top:6px;background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:5px 28px 5px 8px;font-size:.84rem;color:var(--fg2);max-width:100%;-webkit-appearance:none;appearance:none}
.row.imp{align-items:start}
.row.imp input[type=checkbox]{margin-top:2px}
.setor{margin-top:8px}
.setor-h{display:flex;justify-content:space-between;align-items:center;font-size:.78rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--gold2);padding:10px 0 4px;border-bottom:1px solid var(--line)}
.setor-h .dim{font-weight:500;text-transform:none;letter-spacing:0}
.resumo{display:flex;gap:8px;align-items:center;font-size:.92rem;color:var(--fg2)}
.resumo b{color:var(--fg);font-weight:600}
.dot{width:8px;height:8px;border-radius:50%;flex:none}
.dot.ok{background:var(--green)} .dot.bad{background:var(--red)}
.row.ag2{grid-template-columns:3.2rem minmax(0,1fr) auto;padding:10px 0}
.row.ag2 .dt{font-size:.8rem;color:var(--fg3)}
.row.ag2 b{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dial-bg{position:fixed;inset:0;z-index:34;background:rgba(0,0,0,.45)}
.dial{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(98px + env(safe-area-inset-bottom,0px));z-index:35;display:flex;gap:6px;background:var(--s1);border:1px solid var(--line);border-radius:22px;padding:12px 10px;box-shadow:0 12px 40px rgba(0,0,0,.5)}
.dial button{display:flex;flex-direction:column;align-items:center;gap:6px;background:none;border:0;color:var(--fg2);font-size:.72rem;font-weight:600;width:58px;padding:2px 0}
.dial button:disabled{opacity:.4}
.dial .ico{width:48px;height:48px;border-radius:50%;display:grid;place-items:center}
.dial .ico svg{width:22px;height:22px}
@media (max-width:370px){.dial{gap:2px;padding:10px 6px}.dial button{width:54px;font-size:.68rem}.dial .ico{width:42px;height:42px}}
.nav .plus svg{transition:transform .2s}
.nav .plus.open svg{transform:rotate(45deg)}
@media (prefers-reduced-motion:no-preference){.dial:not([hidden]){animation:pop .16s ease-out}@keyframes pop{from{opacity:0;transform:translate(-50%,8px)}}}
.picks{display:flex;flex-direction:column;gap:10px}
.pick{display:flex;gap:14px;align-items:center;text-align:left;background:var(--bg);border:1px solid var(--line);border-radius:16px;padding:16px;width:100%}
.pick:hover:not(:disabled){border-color:var(--gold)}
.pick:disabled{opacity:.5;cursor:default}
.pick b{display:block;font-size:1.05rem}
.pick small{display:block;color:var(--fg2);font-size:.84rem;margin-top:2px}
.pick-ico{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;flex:none}
.pick-ico svg{width:24px;height:24px}
.seg.seg3{grid-template-columns:repeat(3,1fr)}
.seg button[data-tipo="transferencia"][aria-pressed="true"]{color:var(--gold2)}
.seg button{border:0;background:none;padding:9px;border-radius:9px;font-weight:600;color:var(--fg2)}
.seg button[aria-pressed="true"]{background:var(--s2);color:var(--fg)}
.seg button[data-tipo="despesa"][aria-pressed="true"]{color:var(--red)}
.seg button[data-tipo="receita"][aria-pressed="true"]{color:var(--green)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:none;border-radius:999px;padding:6px 12px;font-size:.84rem;color:var(--fg2);font-weight:500}
.chip[aria-pressed="true"]{background:var(--gold-soft);border-color:var(--gold);color:var(--gold2)}
.chips select{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:6px 12px;font-size:.84rem;color:var(--fg2);max-width:100%}

/* leitura por foto */
.ai{border:1px dashed rgba(155,127,224,.5);background:rgba(155,127,224,.07);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px}
.ai-btn{background:var(--purple);color:#14101f}
.ai-step{font-size:.84rem;color:var(--fg2)}
.ai-step.busy::before{content:"";display:inline-block;width:12px;height:12px;border:2px solid var(--purple);border-right-color:transparent;border-radius:50%;margin-right:8px;vertical-align:-2px;animation:spin .8s linear infinite}
.ai-step.bad{color:var(--red)} .ai-step.ok{color:var(--gold2)}
@keyframes spin{to{transform:rotate(360deg)}}

/* navegação */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(26,25,22,.96);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav .wrap{display:grid;grid-template-columns:repeat(5,1fr);align-items:center;height:68px}
.nav button{background:none;border:0;color:var(--fg3);font-size:.72rem;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 0}
.nav button svg{width:22px;height:22px}
.nav button[aria-current="page"]{color:var(--gold)}
.nav .plus{justify-self:center;width:54px;height:54px;border-radius:50%;background:var(--gold);color:#1a1405;display:grid;place-items:center;box-shadow:0 6px 20px rgba(212,168,75,.3);margin-top:-18px}
.nav .plus svg{width:26px;height:26px}

/* folha (modal) */
.sheet-bg{position:fixed;inset:0;overflow:hidden;background:rgba(0,0,0,.6);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--s1);border:1px solid var(--line);border-bottom:0;border-radius:22px 22px 0 0;width:100%;max-width:640px;max-height:92vh;max-height:92dvh;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;padding:18px max(16px,env(safe-area-inset-left,0px)) calc(22px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-right,0px))}
@media (min-width:700px){.sheet-bg{align-items:center}.sheet{border-radius:22px;border-bottom:1px solid var(--line)}}
.sheet-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.x{background:none;border:1px solid var(--line);border-radius:10px;width:34px;height:34px;color:var(--fg2);font-size:1.1rem}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .22s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}}}

/* entrada */
.auth{min-height:100vh;display:grid;place-items:center;padding:24px max(16px,env(safe-area-inset-left,0px));background:radial-gradient(ellipse at 30% 10%,#1e1a0e 0%,var(--bg) 60%)}
.auth .card{width:100%;max-width:400px;padding:28px 22px}
.auth h1{font-family:var(--serif);font-size:2rem;color:var(--gold)}
.mark{width:56px;height:56px}

.menu{display:flex;flex-direction:column}

.menu button:last-child{border-bottom:0}
.menu small{display:block;color:var(--fg3);font-size:.8rem}
.back{background:none;border:0;color:var(--gold);font-weight:600;padding:0;align-self:flex-start}
.code{font-family:var(--serif);font-size:2rem;letter-spacing:.2em;color:var(--gold2)}

.toast.bad{border-color:var(--red);color:#ffd9d6}
.loading{min-height:100vh;display:grid;place-items:center;color:var(--fg3)}

/* ===== Computador ===== */
.side-brand,.plus-txt{display:none}
@media (min-width:1000px){
  body{padding-bottom:0;padding-left:240px}
  .wrap{max-width:1180px}
  .top .wrap{padding-block:16px}
  .top .brand{font-size:1.6rem}
  .nav{top:0;bottom:0;right:auto;width:240px;border-top:0;border-right:1px solid var(--line);padding-bottom:0;background:var(--s1)}

  .side-brand{display:flex;gap:12px;align-items:center;padding:0 8px 22px;order:-2}
  .side-brand .mark{width:40px;height:40px;flex:none}
  .side-brand b{display:block;font-family:var(--serif);font-weight:400;font-size:1.15rem;color:var(--gold)}
  .side-brand small{color:var(--fg3);font-size:.78rem}
  .nav button{flex-direction:row;justify-content:flex-start;gap:12px;font-size:.95rem;padding:11px 14px;border-radius:12px;color:var(--fg2)}
  .nav button:hover{background:var(--s2);color:var(--fg)}
  .nav button[aria-current="page"]{background:var(--gold-soft);color:var(--gold2)}
  .nav .plus{order:-1;width:auto;height:48px;border-radius:12px;margin:0 0 16px;display:flex;justify-content:center;box-shadow:none;color:#1a1405;font-weight:700}
  .nav .plus:hover{background:var(--gold2);color:#1a1405}
  .nav .plus svg{width:20px;height:20px}
  .plus-txt{display:inline}
  main{padding-block:26px 40px;gap:18px}
  .card{padding:22px}
  .kpi .v{font-size:2.1rem}
  /* telas em duas colunas */

  main.view-compras section[style*="sticky"]{bottom:16px!important}
  .sheet{max-width:620px}
  .dial{left:254px;top:84px;bottom:auto;transform:none}
  .dial:not([hidden]){animation:none}
}
@media print{
  :root{color-scheme:light}
  html,body{background:#fff;color:#111;padding:0}
  .top,.nav,.noprint,.sheet-bg,.toast,.upd{display:none!important}

  .card{background:#fff;border:1px solid #ccc;break-inside:avoid}
  .muted,.dim,.row small,.label{color:#555}
  .kpi .v{color:#111!important}
}

const MARK = '<svg class="mark" viewBox="0 0 64 64"><circle cx="26" cy="32" r="14" fill="none" stroke="#d4a84b" stroke-width="3.5"/><circle cx="38" cy="32" r="14" fill="none" stroke="#e8c97a" stroke-width="3.5"/></svg>';

/* ===================== Estado ===================== */
const S = {
  session: null, perfil: null, casal: null,

  mes: mkey(new Date()), view: "inicio", sub: null, relTab: "tudo",

const limparConvite = () => { CONVITE = null; try { localStorage.removeItem("convite"); } catch (e) {} };

const LOAD = {
  perfis: async () => { const { data } = await sb.from("perfis").select("*").order("created_at"); S.perfis = data || []; S.perfil = S.perfis.find(p => p.id === S.session.user.id) || S.perfil; },

/* ===================== Cálculos ===================== */
const pessoa = id => S.perfis.find(p => p.id === id);
const pessoaNome = id => pessoa(id)?.nome || "Casal";
const pessoaCor = id => pessoa(id)?.cor || "var(--gold)";
const cat = id => S.cats.find(c => c.id === id);
const sinal = t => t.tipo === "receita" ? t._c : t.tipo === "transferencia" ? 0 : -t._c;

const ehCred = t => t.forma === "Crédito" && !!t.cartao_id;
// conta fora do cartão que ainda não foi paga (fixos viram reais quando pagos)
const aPagar = t => t.tipo === "despesa" && !ehCred(t) && (t.virtual ? true : t.pago === false || (t.pago == null && t.data > today()));
// salva lançamentos; se o banco ainda não tem as colunas novas, salva sem elas e avisa
let SEM_PAGO = false;
async function gravarTx(op, dados, id) {
  const tira = d => { const x = { ...d }; delete x.pago; delete x.rec_id; delete x.referencia; return x; };
  const run = d => op === "insert" ? sb.from("transacoes").insert(d) : sb.from("transacoes").update(d).eq("id", id);
  let r = await run(SEM_PAGO ? (Array.isArray(dados) ? dados.map(tira) : tira(dados)) : dados);
  if (r.error && /pago|rec_id|referencia|schema cache/i.test(r.error.message)) {
    SEM_PAGO = true; toast("Falta rodar o atualizacao-contas-a-pagar.sql no Supabase. Salvei sem a parte de pagamento.", true);
    r = await run(Array.isArray(dados) ? dados.map(tira) : tira(dados));
  }
  return r;
}
function recMes(mk) {
  const [y, m] = mk.split("-").map(Number); const ld = lastDay(y, m);
  return S.rec.filter(r => r.inicio.slice(0, 7) <= mk && (!r.fim || mk <= r.fim.slice(0, 7)) && !S.tx.some(t => t.rec_id === r.id && t.referencia === mk))
    .map(r => ({ ...r, id: "r:" + r.id + ":" + mk, recId: r.id, virtual: true, data: mk + "-" + pad(Math.min(r.dia, ld)) }));
}
const lanc = mk => S.tx.filter(t => t.data.slice(0, 7) === mk).concat(recMes(mk));
const soma = (arr, tipo) => arr.filter(t => !tipo || t.tipo === tipo).reduce((s, t) => s + t._c, 0);

function saldoConta(c) {

/* ----- faturas e agenda de pagamentos ----- */
const isoDia = (y, m, d) => { const t = new Date(y, m - 1, 1); const Y = t.getFullYear(), M = t.getMonth() + 1; return Y + "-" + pad(M) + "-" + pad(Math.min(d, lastDay(Y, M))); };

const diaSeguinte = iso => { const d = new Date(iso + "T12:00"); d.setDate(d.getDate() + 1); return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); };
const cartaoOk = c => c.ativo && c.fechamento && c.vencimento;
// ciclo da fatura que vence em "venc": compras depois do fechamento anterior até o fechamento
function cicloFatura(c, venc) {
  const [y, m] = venc.split("-").map(Number);
  const mf = c.vencimento > c.fechamento ? m : m - 1;
  return { ate: isoDia(y, mf, c.fechamento), de: isoDia(y, mf - 1, c.fechamento) };

function fatura(c, venc) {

  const meses = [...new Set([de.slice(0, 7), ate.slice(0, 7)])];

  return { ev, inicio: saldoTotal(), fim: saldo, min, minData, ate };
}

function parcAtivos() {

  S.tx.forEach(t => { if (t.grupo && t.parcelas > 1) (g[t.grupo] = g[t.grupo] || []).push(t); });

}

async function authSubmit(f) {
  const m = f.dataset.m, email = f.email.value.trim(), senha = f.senha.value, errEl = $("#a-err");
  errEl.textContent = "";
  if (!email || !senha) { errEl.textContent = "Preencha o e-mail e a senha."; return; }
  if (m === "criar" && !/^\d{6}$/.test(senha)) { errEl.textContent = "A senha precisa ter exatamente 6 números."; return; }
  try { localStorage.setItem("lembrar", f.lembrar.checked ? "1" : "0"); } catch (e) {}
  const btn = f.querySelector("[type=submit]"); btn.disabled = true;
  try {
    if (m === "criar") {
      const nome = f.nome.value.trim(); if (!nome) { errEl.textContent = "Coloque seu nome."; return; }
      const { data, error } = await sb.auth.signUp({ email, password: senha, options: { data: { nome }, emailRedirectTo: CONVITE ? `${BASE_URL}?convite=${encodeURIComponent(CONVITE.codigo)}&de=${encodeURIComponent(CONVITE.de || "")}` : BASE_URL } });
      if (error) throw error;
      try { localStorage.setItem("nome_cadastro", nome); } catch (e) {}
      if (!data.session) { showAuth("entrar", "Conta criada. Abra o e-mail de confirmação que enviamos e depois entre aqui."); return; }
      S.session = data.session; await afterLogin();
    } else {
      const { data, error } = await sb.auth.signInWithPassword({ email, password: senha });
      if (error) throw error;
      S.session = data.session; await afterLogin();
    }
  } catch (e) {
    const msg = String(e.message || e);
    errEl.textContent = /invalid login/i.test(msg) ? "E-mail ou senha incorretos."
      : /not confirmed/i.test(msg) ? "Confirme seu e-mail antes de entrar (veja a caixa de entrada e o spam)."
      : /already registered/i.test(msg) ? "Esse e-mail já tem conta. Use Entrar."
      : msg;
  } finally { btn.disabled = false; }
}

// O app instalado na tela inicial guarda a versão antiga. Ao abrir e ao voltar para ele,

const atualizarApp = v => location.replace(BASE_URL + "?v=" + encodeURIComponent(v || Date.now()));
async function checarVersao(auto) {
  try {
    const r = await fetch(BASE_URL + "version.json?t=" + Date.now(), { cache: "no-store" });
    const { v } = await r.json();
    if (!v || v === APP_VERSION) return false;
    const ocupado = $("#sheet") || (document.activeElement && /INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName));
    // tenta recarregar sozinho só uma vez por versão (se o GitHub ainda servir o index antigo, não entra em loop)
    let tentou = null; try { tentou = sessionStorage.getItem("upd_try"); } catch (e) {}
    if (auto && !ocupado && tentou !== v) { try { sessionStorage.setItem("upd_try", v); } catch (e) {} atualizarApp(v); return true; }
    if (!$("#upd")) {
      const d = document.createElement("div"); d.id = "upd"; d.className = "upd";
      d.innerHTML = `<span>Nova versão disponível</span><button class="btn gold sm" data-act="atualizar" data-v="${esc(v)}">Atualizar</button>`;

}

const ehIOS = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
const instalado = () => window.matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
const suportaPush = () => "serviceWorker" in navigator && "PushManager" in window && "Notification" in window;
function b64u(s) { const p = "=".repeat((4 - s.length % 4) % 4), b = atob((s + p).replace(/-/g, "+").replace(/_/g, "/")); return Uint8Array.from(b, c => c.charCodeAt(0)); }
let swReg = null;
async function registrarSW() { if (!("serviceWorker" in navigator)) return null; try { swReg = await navigator.serviceWorker.register("sw.js"); return swReg; } catch (e) { return null; } }
async function estadoNotif() {
  if (!suportaPush()) return ehIOS && !instalado() ? "instalar" : "sem-suporte";
  if (Notification.permission === "denied") return "bloqueado";
  const reg = swReg || await registrarSW(); const sub = reg && await reg.pushManager.getSubscription();
  return sub && Notification.permission === "granted" ? "ativo" : "inativo";
}
async function atualizarNotifBox() {
  const box = $("#notif-box"); if (!box) return;
  const st = await estadoNotif(); if (!$("#notif-box")) return;
  const outro = S.perfis.find(x => x.id !== S.perfil.id)?.nome || "a outra pessoa";
  const T = {
    instalar: `<div class="hint">No iPhone, as notificações só funcionam no app instalado. Abra o site no Safari, toque em <b>Compartilhar → Adicionar à Tela de Início</b> e abra pelo ícone. Depois volte aqui.</div>`,
    "sem-suporte": `<div class="hint">Este navegador não aceita notificações. No iPhone, precisa do iOS 16.4 ou mais novo e do app instalado na tela inicial.</div>`,
    bloqueado: `<div class="hint neg">As notificações foram bloqueadas neste aparelho. No iPhone: <b>Ajustes → Notificações → Finanças</b> e permita. Depois volte aqui.</div>`,
    inativo: `<div class="hint">Receba um aviso no celular quando ${esc(outro)} lançar um gasto ou entrada.</div><button class="btn gold" data-act="notifon">Ativar notificações neste aparelho</button>`,
    ativo: `<div class="hint pos">Ativo neste aparelho.</div>
      <div class="hint">Você recebe um aviso quando ${esc(outro)} lançar algo e lembretes das contas fora do cartão: 3 dias antes, na véspera, no dia e se atrasar.</div>
      <div class="actions"><button class="btn sm" data-act="testelembrete">Testar lembrete</button><button class="btn ghost sm" data-act="notifoff">Desativar neste aparelho</button></div>`,
  };
  box.innerHTML = T[st];
}
async function ativarNotif(a) {
  a.disabled = true; a.textContent = "Ativando…";
  try {
    const perm = await Notification.requestPermission();
    if (perm !== "granted") { toast("Permissão não concedida.", true); return atualizarNotifBox(); }
    const reg = swReg || await registrarSW(); await navigator.serviceWorker.ready;
    let sub = await reg.pushManager.getSubscription();
    if (!sub) sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64u(VAPID_PUBLIC) });
    const j = sub.toJSON();
    await sb.from("push_subs").delete().eq("endpoint", j.endpoint);
    const { error } = await sb.from("push_subs").insert({ endpoint: j.endpoint, p256dh: j.keys.p256dh, auth: j.keys.auth, user_agent: navigator.userAgent.slice(0, 200) });
    if (error) { toast(/relation|schema cache/i.test(error.message) ? "Falta rodar o atualizacao-notificacoes.sql no Supabase." : "Não salvou: " + error.message, true); return atualizarNotifBox(); }
    toast("Notificações ativadas.");
  } catch (e) { toast("Não consegui ativar: " + (e.message || e), true); }
  atualizarNotifBox();
}
async function desativarNotif() {
  try {
    const reg = swReg || await registrarSW(); const sub = reg && await reg.pushManager.getSubscription();
    if (sub) { await sb.from("push_subs").delete().eq("endpoint", sub.endpoint); await sub.unsubscribe(); }
    toast("Notificações desativadas neste aparelho.");
  } catch (e) { toast("Erro: " + (e.message || e), true); }
  atualizarNotifBox();
}

let channel, pend = {}, pendT;
function subscribe() {
  if (channel) sb.removeChannel(channel);
  channel = sb.channel("casal-" + S.perfil.casal_id);
  Object.keys(LOAD).forEach(t => channel.on("postgres_changes", { event: "*", schema: "public", table: t, filter: "casal_id=eq." + S.perfil.casal_id }, pl => {
    queue(t);
    const n = pl?.new;
    if (t === "transacoes" && pl.eventType === "INSERT" && n && n.tipo !== "transferencia" && n.criado_por && n.criado_por !== S.perfil.id && (!n.parcela || n.parcela === 1)) {
      const v = C(n.parcelas > 1 ? n.valor_total : n.valor);
      toast(`${pessoaNome(n.criado_por)} lançou ${n.tipo === "receita" ? "uma entrada de " : ""}${brl(v)}${n.parcelas > 1 ? ` em ${n.parcelas}x` : ""} · ${n.descricao}`);
    }
  }));
  channel.subscribe();
}
function queue(t) {
  pend[t] = 1; clearTimeout(pendT);
  pendT = setTimeout(async () => { const ts = Object.keys(pend); pend = {}; await Promise.all(ts.map(k => LOAD[k]().catch(() => {}))); safeRender(); }, 350);
}

const semAcento = t => String(t || "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");
const SET_IDX = SETORES.map(([n, e, ps]) => ({ n, ps: ps.split(",").map(x => semAcento(x.trim())).filter(Boolean) }));
function setorDic(nome) {
  const n = " " + semAcento(nome).replace(/[^a-z0-9 ]/g, " ").replace(/\s+/g, " ") + " ";
  let best = null, bestLen = 0;
  for (const s of SET_IDX) for (const p of s.ps) {
    if (new RegExp(" " + p + "(s|es)? ").test(n) && p.length > bestLen) { best = s.n; bestLen = p.length; }
  }
  return best;
}
const setorDe = item => item.setor || setorDic(item.nome) || "Outros";
// IA: classifica de uma vez os itens que o dicionário não reconheceu e salva o setor
let IA_SET_ON = false; const IA_SET_TENTADO = new Set();
async function classificarComIA() {
  if (IA_SET_ON) return;
  const pend = S.compras.filter(i => !i.setor && !setorDic(i.nome) && !IA_SET_TENTADO.has(i.id));
  if (!pend.length) return;
  IA_SET_ON = true; pend.forEach(i => IA_SET_TENTADO.add(i.id));
  try {
    const { data, error } = await sb.functions.invoke("classificar-compras", { body: { itens: pend.map(i => ({ id: i.id, nome: i.nome })), setores: ORDEM_SET } });
    if (error || !data?.setores) return;
    let mudou = false;
    for (const [id, setor] of Object.entries(data.setores)) {
      if (!ORDEM_SET.includes(setor)) continue;
      const { error: e } = await sb.from("compras").update({ setor }).eq("id", id);
      if (!e) mudou = true;
    }
    if (mudou) { await LOAD.compras(); if (S.view === "compras") render(); }
  } finally { IA_SET_ON = false; }
}

/* ===================== Folha (modal) ===================== */
function openSheet(title, html, mount) {
  closeSheet();
  const bg = document.createElement("div");
  bg.className = "sheet-bg"; bg.id = "sheet";
  bg.innerHTML = `<div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="sheet-h"><h2>${esc(title)}</h2><button class="x" data-act="close" aria-label="Fechar">×</button></div>${html}</div>`;
  bg.addEventListener("mousedown", e => { if (e.target === bg) closeSheet(); });
  document.body.appendChild(bg); document.body.style.overflow = "hidden";
  mount && mount(bg);
}
function closeSheet() { const s = $("#sheet"); if (s) s.remove(); document.body.style.overflow = ""; }
document.addEventListener("keydown", e => { if (e.key === "Escape") { closeSheet(); if ($("#dial") && !$("#dial").hidden) toggleDial(false); } });

const pessoaOpts = sel => opt("", "Casal (juntos)", !sel) + S.perfis.map(p => opt(p.id, p.nome, sel === p.id)).join("");
const catOpts = (tipo, sel) => S.cats.filter(c => c.tipo === tipo).map(c => opt(c.id, c.nome, sel === c.id)).join("") || opt("", "Sem categorias");
const contaOpts = sel => opt("", "Não informar", !sel) + S.contas.filter(c => c.ativa).map(c => opt(c.id, c.nome, sel === c.id)).join("");
const cartaoOpts = sel => opt("", "Não informar", !sel) + S.cartoes.filter(c => c.ativo).map(c => opt(c.id, c.nome + (c.final ? " ··" + c.final : ""), sel === c.id)).join("");
const minhaConta = () => (S.contas.find(c => c.ativa && c.pessoa_id === S.perfil.id) || S.contas.find(c => c.ativa))?.id || "";
const meuCartao = () => (S.cartoes.find(c => c.ativo && c.pessoa_id === S.perfil.id) || S.cartoes.find(c => c.ativo))?.id || "";

function bindPagamento(root, pref) {
  const forma = $(`#${pref}-forma`, root);
  const upd = () => {
    const cred = forma.value === "Crédito";
    $(`#${pref}-wconta`, root).hidden = cred;
    $(`#${pref}-wcartao`, root).hidden = !cred;
    const wp = $(`#${pref}-wparc`, root); if (wp) wp.hidden = !cred;
    prevParc(root, pref);
  };
  forma.addEventListener("change", upd); upd();
  $(`#${pref}-cartao`, root)?.addEventListener("change", e => { const c = S.cartoes.find(x => x.id === e.target.value); if (c && c.pessoa_id) $(`#${pref}-pessoa`, root).value = c.pessoa_id; });
}
function prevParc(root, pref) {
  const el = $(`#${pref}-prev`, root), p = $(`#${pref}-parc`, root); if (!el) return;
  const n = p && !$(`#${pref}-wparc`, root).hidden ? Number(p.value) : 1, v = parseMoney($(`#${pref}-valor`, root).value), d = $(`#${pref}-data`, root).value;
  el.textContent = n > 1 && v > 0 && d ? `${n}x de ${brl(Math.floor(v / n))} · uma parcela por mês até ${mesNome(addMonths(d, n - 1).slice(0, 7), { month: "short", year: "numeric" })}` : "";
}
function bindTipo(root, pref, onChange) {
  root.querySelectorAll(".seg [data-tipo]").forEach(b => b.addEventListener("click", () => {
    root.querySelectorAll(".seg [data-tipo]").forEach(x => x.setAttribute("aria-pressed", x === b));
    CUR.tipo = b.dataset.tipo; $(`#${pref}-cat`, root).innerHTML = catOpts(CUR.tipo); onChange && onChange();
  }));
}

async function lerFatura(files, root) {
  const st = $("#if-step", root), btn = root.querySelector("[data-act=ifescolher]");
  const step = (m, c = "busy") => { st.className = "ai-step " + c; st.textContent = m; };

      if (f.type === "application/pdf" || nome.endsWith(".pdf")) {
        if (f.size > 9e6) { step("O PDF passa de 9 MB. Envie só as páginas com os lançamentos ou prints.", "bad"); return; }
        arquivos.push({ mediaType: "application/pdf", data: await arqB64(f) });

    revisarFatura(d, alvo, root);

}

  if (!(c > 0)) { err.textContent = "Coloque um valor válido, como 45,90."; return; }
  if (!desc) { err.textContent = "Coloque uma descrição."; return; }
  if (tr) {
    const de = $("#t-conta", root).value, para = $("#t-dest", root).value;
    if (S.contas.length < 2) { err.textContent = "Cadastre pelo menos duas contas em Mais → Contas."; return; }
    if (!de || !para) { err.textContent = "Escolha a conta de origem e a de destino."; return; }
    if (de === para) { err.textContent = "Escolha contas diferentes."; return; }
    if (!data) { err.textContent = "Escolha a data."; return; }
    const row = { tipo: "transferencia", descricao: desc, valor: R(c), data, conta_id: de, conta_destino_id: para, pessoa_id: $("#t-pessoa", root).value || null, forma: "Transferência", categoria_id: null, cartao_id: null, obs: $("#t-obs", root).value.trim() || null };
    const btn = root.querySelector("[type=submit]"); btn.disabled = true;
    const { error } = CUR.t ? await sb.from("transacoes").update(row).eq("id", CUR.t.id) : await sb.from("transacoes").insert(row);
    btn.disabled = false;
    if (error) { err.textContent = /conta_destino|check constraint|schema cache/i.test(error.message) ? "Falta rodar o atualizacao-transferencias.sql no Supabase." : "Não salvou: " + error.message; return; }
    closeSheet(); await LOAD.transacoes(); render(); toast(CUR.t ? "Transferência atualizada." : "Transferência feita."); return;
  }
  if (!data) { err.textContent = "Escolha a data."; return; }
  const forma = $("#t-forma", root).value, cred = forma === "Crédito";
  const base = { tipo: CUR.tipo, descricao: desc, categoria_id: $("#t-cat", root).value || null, pessoa_id: $("#t-pessoa", root).value || null, forma, conta_id: cred ? null : ($("#t-conta", root).value || null), cartao_id: cred ? ($("#t-cartao", root).value || null) : null, obs: $("#t-obs", root).value.trim() || null };
  if (CUR.tipo === "despesa" && !cred) base.pago = $("#t-pago", root).checked;
  const btn = root.querySelector("[type=submit]"); btn.disabled = true;
  let error;
  if (CUR.t) {
    ({ error } = await gravarTx("update", { ...base, valor: R(c), data }, CUR.t.id));
    if (!error && CUR.t.grupo) ({ error } = await sb.from("transacoes").update({ descricao: base.descricao, categoria_id: base.categoria_id, pessoa_id: base.pessoa_id, cartao_id: base.cartao_id }).eq("grupo", CUR.t.grupo));
  } else {
    const n = cred ? Number($("#t-parc", root).value) || 1 : 1, rows = [];
    const extra = { comprovante: CUR.comprovante || null, origem: CUR.origem };
    if (n === 1) rows.push({ ...base, ...extra, valor: R(c), data });
    else {
      const g = crypto.randomUUID(), each = Math.floor(c / n), rest = c - each * n;
      for (let k = 0; k < n; k++) rows.push({ ...base, ...(k === 0 ? extra : { origem: CUR.origem }), valor: R(each + (k === 0 ? rest : 0)), data: addMonths(data, k), parcela: k + 1, parcelas: n, grupo: g, valor_total: R(c) });
    }
    ({ error } = await gravarTx("insert", rows));
  }
  btn.disabled = false;
  if (error) { err.textContent = "Não salvou: " + error.message; return; }
  const after = CUR.onSaved;
  closeSheet(); await LOAD.transacoes(); render();
  toast(CUR.t ? "Alterações salvas." : "Lançado.");
  after && after();
}

/* ----- leitura por foto ----- */
function encolher(file, max = 1600) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      const s = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
      const cv = document.createElement("canvas"); cv.width = Math.round(img.naturalWidth * s); cv.height = Math.round(img.naturalHeight * s);
      const ctx = cv.getContext("2d"); ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, cv.width, cv.height); ctx.drawImage(img, 0, 0, cv.width, cv.height);
      URL.revokeObjectURL(url);
      const dataUrl = cv.toDataURL("image/jpeg", 0.82);
      cv.toBlob(b => b ? res({ blob: b, b64: dataUrl.split(",")[1] }) : rej(new Error("blob")), "image/jpeg", 0.82);
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error("decode")); };
    img.src = url;
  });
}
async function lerFoto(file, root) {
  const st = $("#t-step", root), btn = root.querySelector("[data-act=foto]");
  const step = (msg, cls = "busy") => { st.className = "ai-step " + cls; st.textContent = msg; };
  root.querySelectorAll(".f.check").forEach(x => x.classList.remove("check"));
  btn.disabled = true;
  try {
    step("1/3 · Preparando a foto…");
    let img;
    try { img = await encolher(file); } catch (e) { step("Não consegui abrir essa imagem. Use uma foto em JPG/PNG ou um print da tela.", "bad"); return; }
    step("2/3 · Enviando a foto…");
    const path = `${S.perfil.casal_id}/${today().slice(0, 7)}/${crypto.randomUUID()}.jpg`;
    const upload = sb.storage.from("comprovantes").upload(path, img.blob, { contentType: "image/jpeg", upsert: false });
    step("3/3 · Lendo a nota…");
    const { data, error } = await sb.functions.invoke("ler-comprovante", { body: { image: img.b64, mediaType: "image/jpeg", categorias: S.cats.map(c => c.nome), cartoes: S.cartoes.filter(c => c.final).map(c => c.final), hoje: today() } });
    const up = await upload;
    if (!up.error) CUR.comprovante = path;
    if (error) {
      let msg = error.message || "erro desconhecido";
      try { const j = await error.context.json(); msg = j.error || msg; } catch (e) {}
      if (/Failed to send|FunctionsFetchError|404/i.test(msg + (error.name || ""))) msg = "A função ler-comprovante não respondeu. Confira se ela foi publicada no Supabase.";
      step("Não consegui ler: " + msg + " Você pode preencher à mão.", "bad"); return;
    }
    if (data?.error) { step("Não consegui ler: " + data.error, "bad"); return; }
    preencher(data.dados || {}, root, step);
  } finally { btn.disabled = false; }
}
function preencher(d, root, step) {
  if (d.legivel === false) { step("A imagem não parece um comprovante legível. Tente outra foto, com boa luz e sem cortes.", "bad"); return; }
  const tipo = d.tipo === "receita" ? "receita" : "despesa";
  root.querySelector(`.seg [data-tipo="${tipo}"]`).click();
  if (d.valor > 0) $("#t-valor", root).value = fmtMoney(Math.round(d.valor * 100));
  if (d.descricao) $("#t-desc", root).value = d.descricao;
  if (/^\d{4}-\d{2}-\d{2}$/.test(d.data || "")) $("#t-data", root).value = d.data;
  if (FORMAS.includes(d.forma)) $("#t-forma", root).value = d.forma;
  const c = S.cats.find(x => x.tipo === tipo && x.nome.toLowerCase() === String(d.categoria || "").toLowerCase());
  if (c) $("#t-cat", root).value = c.id;
  if (d.cartao_final) { const k = S.cartoes.find(x => x.final && String(d.cartao_final).endsWith(x.final)); if (k) { $("#t-cartao", root).value = k.id; if (k.pessoa_id) $("#t-pessoa", root).value = k.pessoa_id; } }
  if (d.parcelas > 1 && $("#t-parc", root)) $("#t-parc", root).value = String(Math.min(24, d.parcelas));
  $("#t-forma", root).dispatchEvent(new Event("change"));
  const duv = Array.isArray(d.duvidas) ? d.duvidas : [];
  if (d.confianca === "baixa") duv.push("valor", "data");
  const mapa = { valor: "w-valor", data: "w-data", descricao: "w-desc", categoria: "w-categoria", forma: "w-forma", parcelas: "t-wparc" };
  [...new Set(duv)].forEach(k => $("#" + mapa[k], root)?.classList.add("check"));
  CUR.origem = "foto";
  step(duv.length ? "Pronto. Confira os campos destacados em dourado e toque em Lançar." : "Pronto. Confira e toque em Lançar.", "ok");
}

  sinal: a => { const i = a.closest("form").querySelector(".money"); i.value = i.value.startsWith("-") ? i.value.slice(1) : "-" + i.value; },
  notifon: a => ativarNotif(a),
  notifoff: () => desativarNotif(),
  testelembrete: async a => {
    a.disabled = true; a.textContent = "Enviando…";
    const { data, error } = await sb.functions.invoke("lembretes", { body: { teste: true } });
    a.disabled = false; a.textContent = "Testar lembrete";
    if (error) { let m = error.message; try { m = (await error.context.json()).error || m; } catch (e) {} return toast(/404|Failed to send|FunctionsFetchError/i.test(m + (error.name || "")) ? "A função lembretes ainda não foi publicada no Supabase." : "Não enviou: " + m, true); }
    toast(data?.enviados ? "Lembrete enviado. Confira o celular." : "Nenhum aparelho do casal com notificação ativa.");
  },
  atualizar: async a => { if (a.dataset.v) return atualizarApp(a.dataset.v); a.disabled = true; a.textContent = "Verificando…"; if (!(await checarVersao(true))) { a.disabled = false; a.textContent = "Atualizar app"; toast("Você já está na versão mais nova."); } },
  letras: a => { const i = a.closest("form").querySelector(`[name="${a.dataset.name}"]`); i.setAttribute("inputmode", "text"); i.removeAttribute("pattern"); i.removeAttribute("maxlength"); i.classList.remove("pin"); a.remove(); i.focus(); },
  semsenha: async a => {
    const err = $("#s-err"); a.disabled = true;
    const { error } = await sb.auth.resetPasswordForEmail(S.session.user.email, { redirectTo: location.origin + location.pathname });
    a.disabled = false;
    if (error) { err.style.color = ""; err.textContent = /rate|seconds/i.test(error.message) ? "Muitos e-mails em pouco tempo. Espere alguns minutos e tente de novo." : error.message; return; }
    err.style.color = "var(--gold2)"; err.textContent = "Enviamos um link para " + S.session.user.email + ". Abra o e-mail neste aparelho e toque no link para criar a senha nova (veja também o spam).";
  },
  ocultar: () => { OCULTO = !OCULTO; try { localStorage.setItem("ocultar", OCULTO ? "1" : "0"); } catch (e) {} shell(); render(); },
  trocarfoto: () => $("#p-foto").click(),
  rmfoto: async () => { const { error } = await sb.from("perfis").update({ foto: null }).eq("id", S.perfil.id); if (error) return toast(precisaSQL(error) || error.message, true); await LOAD.perfis(); shell(); render(); toast("Foto removida."); },
  copiarlink: async () => { const l = linkConvite(); try { await navigator.clipboard.writeText(l); toast("Link copiado."); } catch (e) { toast(l); } },
  compartilhar: async () => { try { await navigator.share({ title: "Finanças a Dois", text: "Entra no nosso controle financeiro do casal:", url: linkConvite() }); } catch (e) {} },
  copiar: async () => { const c = S.casal?.codigo || ""; try { await navigator.clipboard.writeText(c); toast("Código copiado."); } catch (e) { toast("Código: " + c); } },
  vercomp: async a => {
    const w = window.open("", "_blank");
    const { data, error } = await sb.storage.from("comprovantes").createSignedUrl(a.dataset.path, 600);
    if (error) { w && w.close(); toast("Não consegui abrir o comprovante.", true); return; }
    if (w) w.location = data.signedUrl; else location.href = data.signedUrl;
  },
  txdel: () => {
    const t = CUR.t, el = $("#t-del");
    el.innerHTML = t.grupo
      ? `<button type="button" class="btn sm armed" data-act="txdel1">Só esta parcela</button><button type="button" class="btn sm armed" data-act="txdelf">Esta e as próximas</button><button type="button" class="btn sm armed" data-act="txdela">Todas as ${S.tx.filter(x => x.grupo === t.grupo).length}</button>`
      : `<button type="button" class="btn sm armed" data-act="txdel1">Confirmar exclusão</button>`;
  },
  txdel1: () => delTx(q => q.eq("id", CUR.t.id)),
  txdelf: () => delTx(q => q.eq("grupo", CUR.t.grupo).gte("parcela", CUR.t.parcela)),
  txdela: () => delTx(q => q.eq("grupo", CUR.t.grupo)),
  recend: async () => {
    const { error } = await sb.from("recorrentes").update({ fim: mkey(new Date()) + "-01" }).eq("id", CUR.r.id);
    if (error) return toast("Não encerrou: " + error.message, true);
    closeSheet(); await LOAD.recorrentes(); render(); toast("Encerrado. Para de contar a partir do mês que vem.");
  },
  arm: async a => {
    const key = a.dataset.key;
    if (ARM !== key) { ARM = key; if ($("#sheet") && key.startsWith("rec:")) { a.classList.remove("ghost", "danger"); a.classList.add("armed"); a.textContent = "Apagar de todos os meses"; } else render(); setTimeout(() => { if (ARM === key) { ARM = null; if (!$("#sheet")) render(); } }, 4000); return; }
    ARM = null;
    const [tipo, id] = key.split(":");
    const tabela = { conta: "contas", cartao: "cartoes", cat: "categorias", rec: "recorrentes" }[tipo];
    const { error } = await sb.from(tabela).delete().eq("id", id);
    if (error) return toast("Não removeu: " + error.message, true);
    if (tipo === "rec") closeSheet();
    await LOAD[tabela](); render(); toast("Removido.");
  },
  ajsaldo: a => {
    const c = S.contas.find(x => x.id === a.dataset.id); if (!c) return;
    openSheet("Ajustar saldo", `<form class="form" id="ajf" novalidate><div class="hint">Informe quanto tem hoje em <b>${esc(c.nome)}</b>. A partir de hoje o saldo segue os lançamentos.</div><label class="f"><span>Saldo hoje (R$)</span><input id="aj-v" class="big num money" data-neg="1" inputmode="numeric" value="${fmtMoney(saldoConta(c))}"></label><button type="button" class="btn ghost sm" data-act="sinal" style="align-self:flex-start">Trocar sinal (+/−)</button><button class="btn gold" type="submit">Salvar</button></form>`, root => {
      $("#ajf", root).addEventListener("submit", async e => {
        e.preventDefault(); const v = parseMoney($("#aj-v", root).value); if (!isFinite(v)) return;
        // o saldo informado já inclui os lançamentos de hoje; desconta para não somar duas vezes
        const hj = today();
        const deHoje = S.tx.filter(t => t.conta_id === c.id && t.data === hj).reduce((s, t) => s + sinal(t), 0) + recMes(hj.slice(0, 7)).filter(t => t.conta_id === c.id && t.data === hj).reduce((s, t) => s + sinal(t), 0);
        const { error } = await sb.from("contas").update({ saldo_inicial: R(v - deHoje), saldo_data: hj }).eq("id", c.id);
        if (error) return toast("Não salvou: " + error.message, true);
        closeSheet(); await LOAD.contas(); render(); toast("Saldo ajustado.");
      });
    });
  },
  setoritem: a => {
    const i = S.compras.find(x => x.id === a.dataset.id); if (!i) return; const atual = setorDe(i);
    openSheet("Setor de " + i.nome, `<div class="picks">${ORDEM_SET.map(n => `<button class="pick" data-act="setsetor" data-id="${i.id}" data-s="${esc(n)}" style="padding:12px 14px${n === atual ? ";border-color:var(--gold)" : ""}"><span style="font-size:1.4rem">${setorEmoji(n)}</span><span><b>${esc(n)}</b></span></button>`).join("")}</div>`);
  },
  setsetor: async a => {
    const { error } = await sb.from("compras").update({ setor: a.dataset.s }).eq("id", a.dataset.id);
    closeSheet();
    if (error) return toast(/setor|schema cache/i.test(error.message) ? "Falta rodar o atualizacao-setores.sql no Supabase." : error.message, true);
    await LOAD.compras(); render(); toast("Setor alterado.");
  },
  rmitem: async a => { await sb.from("compras").delete().eq("id", a.dataset.id); await LOAD.compras(); render(); },
  finalizar: () => {
    const got = S.compras.filter(i => i.pego), tot = got.reduce((s, i) => s + Math.round(i._p * i.qtd), 0);
    if (!tot) { toast("Coloque os preços dos itens marcados antes de finalizar.", true); return; }
    const merc = S.cats.find(c => c.tipo === "despesa" && c.nome === "Mercado");
    openTx(null, { descricao: "Compra do mercado", _c: tot, categoria_id: merc?.id || "", obs: got.map(i => i.nome).join(", ").slice(0, 300), origem: "lista" }, async () => {
      await sb.from("compras").delete().in("id", got.map(i => i.id)); await LOAD.compras(); render();
    });
  },
};
function precisaSQL(error) {
  return /column|schema cache/i.test(error?.message || "") ? "Falta rodar a atualização do banco (atualizacao-perfil.sql) no SQL Editor do Supabase." : "";
}
function fotoQuadrada(file, size = 256) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      const s = Math.min(img.naturalWidth, img.naturalHeight), cv = document.createElement("canvas");
      cv.width = cv.height = size;
      cv.getContext("2d").drawImage(img, (img.naturalWidth - s) / 2, (img.naturalHeight - s) / 2, s, s, 0, 0, size, size);
      URL.revokeObjectURL(url); res(cv.toDataURL("image/jpeg", 0.85));
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error("decode")); };
    img.src = url;
  });
}
async function salvarFoto(file) {
  let foto; try { foto = await fotoQuadrada(file); } catch (e) { return toast("Não consegui abrir essa imagem. Tente outra.", true); }
  const { error } = await sb.from("perfis").update({ foto }).eq("id", S.perfil.id);
  if (error) return toast(precisaSQL(error) || error.message, true);
  await LOAD.perfis(); shell(); render(); toast("Foto atualizada.");
}
async function delTx(fn) {
  const { error } = await fn(sb.from("transacoes").delete());
  if (error) return toast("Não excluiu: " + error.message, true);
  closeSheet(); await LOAD.transacoes(); render(); toast("Excluído.");
}
document.addEventListener("click", e => {
  const a = e.target.closest("[data-act]"); if (!a) return;
  const f = ACT[a.dataset.act]; if (!f) return;
  if (a.tagName === "INPUT" || a.tagName === "SELECT") return; // tratados em change
  e.preventDefault(); f(a, e);
});
// Dinheiro com vírgula fixa: digitar 1990 vira 19,90 (os dois últimos números são centavos)
function mascaraDinheiro(i) {
  const neg = i.dataset.neg === "1" && /-/.test(i.value);
  const dig = i.value.replace(/\D/g, "").replace(/^0+/, "").slice(0, 11);
  if (!dig) { i.value = neg ? "-" : ""; return; }
  const c = Number(dig), txt = (c / 100).toLocaleString("pt-BR", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  i.value = (neg ? "-" : "") + txt;
}
const fmtMoney = c => (c < 0 ? "-" : "") + (Math.abs(c) / 100).toLocaleString("pt-BR", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
document.addEventListener("input", e => { const i = e.target; if (i.classList && i.classList.contains("money")) { mascaraDinheiro(i); try { i.setSelectionRange(i.value.length, i.value.length); } catch (_) {} } });
document.addEventListener("focusin", e => { const i = e.target; if (i.classList && i.classList.contains("money")) setTimeout(() => { try { i.setSelectionRange(i.value.length, i.value.length); } catch (_) {} }, 0); });
document.addEventListener("input", e => { const i = e.target; if (i.classList && i.classList.contains("pin")) { const v = i.value.replace(/\D/g, "").slice(0, 6); if (v !== i.value) i.value = v; } });
document.addEventListener("change", e => { if (e.target.id === "cam-file") { const f = e.target.files[0]; e.target.value = ""; if (f) fotoEscolhida(f); } });
document.addEventListener("change", async e => {
  const a = e.target; if (!a.dataset || !a.dataset.act) return;
  const id = a.dataset.id;
  if (a.dataset.act === "filtcat") { S.filt.cat = a.value; render(); return; }
  if (a.dataset.act === "ocultarpadrao") { OCULTO = a.checked; try { localStorage.setItem("ocultar", OCULTO ? "1" : "0"); } catch (e) {} shell(); render(); return; }
  if (a.dataset.act === "avatarfile") { const f = a.files[0]; a.value = ""; if (f) salvarFoto(f); return; }
  if (a.dataset.act === "pego") await sb.from("compras").update({ pego: a.checked }).eq("id", id);
  if (a.dataset.act === "qtd") { const q = parseFloat(String(a.value).replace(",", ".")); await sb.from("compras").update({ qtd: isFinite(q) && q > 0 ? q : 1 }).eq("id", id); }
  if (a.dataset.act === "preco") { const p = parseMoney(a.value); await sb.from("compras").update({ preco: R(p > 0 ? p : 0) }).eq("id", id); }
  if (["pego", "qtd", "preco"].includes(a.dataset.act)) { await LOAD.compras(); render(); }
});

/* ===================== Formulários das telas ===================== */
const FORM = {
  auth: f => authSubmit(f),
  criarcasal: f => onboard(f, "criar"),
  entrarcasal: f => onboard(f, "entrar"),
  additem: async f => { const nome = f.nome.value.trim(); if (!nome) return; const { error } = await sb.from("compras").insert({ nome }); if (error) return toast(error.message, true); f.reset(); await LOAD.compras(); render(); $("[data-form=additem] input")?.focus(); },
  conta: async f => {
    const nome = f.nome.value.trim(); if (!nome) return toast("Coloque o nome da conta.", true);
    const s = parseMoney(f.saldo.value);
    const { error } = await sb.from("contas").insert({ nome, tipo: f.tipo.value, banco: f.banco.value.trim() || null, pessoa_id: f.pessoa.value || null, saldo_inicial: R(isFinite(s) ? s : 0), saldo_data: today() });
    if (error) return toast(error.message, true); await LOAD.contas(); render(); toast("Conta adicionada.");
  },
  cartao: async f => {
    const nome = f.nome.value.trim(); if (!nome) return toast("Coloque o nome do cartão.", true);
    const n = v => { const x = parseInt(v); return x >= 1 && x <= 31 ? x : null; };
    const { error } = await sb.from("cartoes").insert({ nome, pessoa_id: f.pessoa.value || null, final: f.final.value.replace(/\D/g, "").slice(-4) || null, fechamento: n(f.fechamento.value), vencimento: n(f.vencimento.value), cor: f.cor.value });
    if (error) return toast(error.message, true); await LOAD.cartoes(); render(); toast("Cartão adicionado.");
  },
  cat: async f => {
    const nome = f.nome.value.trim(); if (!nome) return;
    const { error } = await sb.from("categorias").insert({ nome, tipo: f.tipo.value, cor: f.cor.value });
    if (error) return toast(error.message, true); await LOAD.categorias(); render(); toast("Categoria adicionada.");
  },
  perfil: async f => {
    const renda = parseMoney(f.renda.value), cor = f.querySelector("[name=cor]:checked")?.value || S.perfil.cor;
    const { error } = await sb.from("perfis").update({ nome: f.nome.value.trim() || S.perfil.nome, cor, renda_mensal: isFinite(renda) ? R(renda) : null }).eq("id", S.perfil.id);
    if (error) return toast(error.message, true); await LOAD.perfis(); shell(); render(); toast("Perfil salvo.");
  },
  prefs: async f => {
    const prefs = { ...(S.perfil.prefs || {}), quem: f.quem.value, forma: f.forma.value, conta: f.conta.value || null, cartao: f.cartao.value || null };
    const { error } = await sb.from("perfis").update({ prefs }).eq("id", S.perfil.id);
    if (error) return toast(precisaSQL(error) || error.message, true); await LOAD.perfis(); render(); toast("Preferências salvas.");
  },
  casal: async f => {
    const meta = parseMoney(f.meta.value);
    const up = { nome: f.nome.value.trim() || "Nosso casal" };
    if (f.meta.value.trim() || S.casal?.meta_mensal != null) up.meta_mensal = isFinite(meta) && meta > 0 ? R(meta) : null;
    const { error } = await sb.from("casais").update(up).eq("id", S.perfil.casal_id);
    if (error) return toast(precisaSQL(error) || error.message, true);
    const { data } = await sb.from("casais").select("*").maybeSingle(); S.casal = data; render(); toast("Salvo.");
  },
  senha: async f => {
    const err = $("#s-err"); err.textContent = ""; err.style.color = "";
    const atual = f.atual.value, nova = f.nova.value, conf = f.conf.value;
    if (!atual) { err.textContent = "Digite sua senha atual."; return; }
    if (!/^\d{6}$/.test(nova)) { err.textContent = "A nova senha precisa ter exatamente 6 números."; return; }
    if (nova !== conf) { err.textContent = "As duas senhas novas não são iguais."; return; }
    if (nova === atual) { err.textContent = "A nova senha é igual à atual."; return; }
    const btn = f.querySelector("[type=submit]"); btn.disabled = true;
    const { error: e1 } = await sb.auth.signInWithPassword({ email: S.session.user.email, password: atual });
    if (e1) { btn.disabled = false; err.textContent = "Senha atual incorreta."; return; }
    const { error } = await sb.auth.updateUser({ password: nova });
    btn.disabled = false;
    if (error) { err.textContent = /different from the old/i.test(error.message) ? "A nova senha é igual à atual." : error.message; return; }
    f.reset(); err.style.color = "var(--gold2)"; err.textContent = "Senha alterada.";
  },
};
document.addEventListener("submit", e => {
  const f = e.target; if (!f.dataset || !f.dataset.form) return;
  e.preventDefault(); FORM[f.dataset.form]?.(f);
});

/* ===================== Início ===================== */
sb.auth.onAuthStateChange((ev, session) => {
  if (ev === "PASSWORD_RECOVERY") {
    S.session = session;
    setTimeout(() => openSheet("Nova senha", `<form class="form" id="pwf" novalidate><label class="f"><span>Nova senha (6 números)</span><input id="pw" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="6" class="pin" autocomplete="new-password"></label><div class="err" id="pw-err"></div><button class="btn gold" type="submit">Salvar senha</button></form>`, root => {
      $("#pwf", root).addEventListener("submit", async e => {
        e.preventDefault(); const p = $("#pw", root).value;
        if (!/^\d{6}$/.test(p)) { $("#pw-err", root).textContent = "A senha precisa ter exatamente 6 números."; return; }
        const { error } = await sb.auth.updateUser({ password: p });
        if (error) { $("#pw-err", root).textContent = error.message; return; }
        closeSheet(); toast("Senha alterada."); afterLogin();
      });
    }), 300);
  }
  if (ev === "TOKEN_REFRESHED" && session) S.session = session;
});
(async () => {
  try {
    const qs = new URLSearchParams(location.search);
    if (qs.get("convite")) {
      CONVITE = { codigo: qs.get("convite").toUpperCase().slice(0, 6), de: (qs.get("de") || "").slice(0, 40) };
      try { localStorage.setItem("convite", JSON.stringify(CONVITE)); } catch (e) {}
    }
    if (qs.has("convite") || qs.has("v")) history.replaceState(null, "", location.pathname);
    checarVersao(true);
    registrarSW();
    const { data: { session } } = await sb.auth.getSession();
    if (!session) return showAuth(CONVITE ? "criar" : "entrar");
    S.session = session; await afterLogin();
  } catch (e) {
    $("#app").innerHTML = `<div class="loading">Erro ao iniciar: ${esc(e.message || e)}</div>`;
  }
})();
</script>
